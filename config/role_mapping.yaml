# Role Mapping Configuration
# Maps external job titles to internal canonical roles and seniority levels

# Canonical internal roles (taxonomy)
canonical_roles:
  - "Software Engineer"
  - "DevOps Engineer"
  - "Data Engineer"
  - "Data Scientist"
  - "QA Engineer"
  - "Frontend Developer"
  - "Backend Developer"
  - "Full Stack Developer"
  - "Mobile Developer"
  - "Cloud Architect"
  - "Solutions Architect"
  - "Product Manager"
  - "Project Manager"
  - "Business Analyst"
  - "Scrum Master"
  - "Security Engineer"
  - "Network Engineer"
  - "Database Administrator"
  - "Systems Administrator"
  - "UI/UX Designer"

# Seniority levels
seniority_levels:
  - "Junior"
  - "Mid"
  - "Senior"
  - "Lead"
  - "Architect"

# Keywords for seniority detection
seniority_keywords:
  Junior:
    - "junior"
    - "jr"
    - "graduate"
    - "entry"
    - "associate"
    - "trainee"
  Mid:
    - "mid"
    - "intermediate"
    - "developer"  # default if no other level specified
    - "engineer"   # default if no other level specified
  Senior:
    - "senior"
    - "sr"
    - "principal"
    - "staff"
  Lead:
    - "lead"
    - "team lead"
    - "technical lead"
    - "tech lead"
  Architect:
    - "architect"
    - "chief"
    - "head of"
    - "principal architect"

